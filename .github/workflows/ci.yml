name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.23'

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================================================
  # PHASE 1: QUICK CHECKS (fast feedback, runs in parallel)
  # ==========================================================================

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted. Run 'gofmt -w .'"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.62.0
          args: --timeout=5m

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          coverage=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${coverage}%"
          if (( $(echo "$coverage < 40" | bc -l) )); then
            echo "::warning::Coverage ${coverage}% is below 40%"
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  # ==========================================================================
  # PHASE 2: BUILD (depends on lint + test passing)
  # ==========================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          LDFLAGS="-s -w -X github.com/ihsanmokhlisse/gitopsi/internal/cli.Version=${VERSION}"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "${LDFLAGS}" -o bin/gitopsi-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./cmd/gitopsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitopsi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/gitopsi-*

  # ==========================================================================
  # PHASE 3: VALIDATION (depends on build)
  # ==========================================================================

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: go test -v -race ./internal/integration/... -timeout 10m

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run regression tests
        run: go test -v -race ./internal/regression/... -timeout 5m

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: gitopsi-linux-amd64
          path: bin/

      - name: Setup
        run: |
          chmod +x bin/gitopsi-linux-amd64
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Run E2E tests
        run: go test -v -tags=e2e ./test/e2e/... -timeout 20m

  manifest-validation:
    name: Manifest Validation
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: gitopsi-linux-amd64
          path: bin/

      - name: Setup tools
        run: |
          chmod +x bin/gitopsi-linux-amd64
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Generate and validate manifests
        run: |
          for preset in minimal standard enterprise; do
            echo "=== Testing $preset preset ==="
            mkdir -p /tmp/test-$preset
            bin/gitopsi-linux-amd64 init \
              --config test/e2e/fixtures/${preset}-config.yaml \
              --output /tmp/test-$preset

            # Validate with kubeconform
            find /tmp/test-$preset -name "*.yaml" | xargs kubeconform -strict -ignore-missing-schemas -summary || true

            # Test kustomize build
            for overlay in /tmp/test-$preset/*/infrastructure/overlays/*; do
              if [ -d "$overlay" ]; then
                kustomize build "$overlay" > /dev/null
              fi
            done
          done

  # ==========================================================================
  # PHASE 4: SECURITY (informational, doesn't block CI)
  # ==========================================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true  # Don't fail CI for security warnings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "=== Vulnerability Scan ==="
          govulncheck ./... || echo "::warning::Vulnerabilities found (may require Go upgrade)"

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity=high ./... || echo "::warning::High severity issues found"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Build
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # ==========================================================================
  # PHASE 5: CLUSTER E2E (optional, on main/develop push only)
  # ==========================================================================

  e2e-cluster:
    name: E2E Cluster
    runs-on: ubuntu-latest
    needs: [e2e, manifest-validation]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: gitopsi-linux-amd64
          path: bin/

      - name: Setup cluster
        run: |
          chmod +x bin/gitopsi-linux-amd64

          # Install Kind
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind

          # Install Helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          # Install kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

          # Create cluster
          kind create cluster --name e2e-ci --wait 120s
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: Install ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          kubectl create namespace argocd
          helm install argocd argo/argo-cd \
            --namespace argocd \
            --set server.service.type=ClusterIP \
            --set configs.params."server\.insecure"=true \
            --wait --timeout 5m
          kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s
        timeout-minutes: 8

      - name: Test GitOps flow
        run: |
          # Generate manifests
          mkdir -p /tmp/output
          bin/gitopsi-linux-amd64 init \
            --config test/e2e/fixtures/standard-config.yaml \
            --output /tmp/output

          # Apply infrastructure
          project_dir="/tmp/output/test-standard"
          for ns_file in "$project_dir"/infrastructure/base/namespaces/*.yaml; do
            [ -f "$ns_file" ] && kubectl apply -f "$ns_file"
          done

          # Verify
          kubectl get namespaces | grep test-standard || true
          kubectl get appprojects -n argocd || true

      - name: Cleanup
        if: always()
        run: kind delete cluster --name e2e-ci || true

  # ==========================================================================
  # FINAL GATE
  # ==========================================================================

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, build, integration, regression, e2e, manifest-validation]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== CI Results ==="
          echo "lint:        ${{ needs.lint.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "build:       ${{ needs.build.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "regression:  ${{ needs.regression.result }}"
          echo "e2e:         ${{ needs.e2e.result }}"
          echo "manifest:    ${{ needs.manifest-validation.result }}"

          # Only fail on core jobs
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.integration.result }}" != "success" ]] || \
             [[ "${{ needs.regression.result }}" != "success" ]] || \
             [[ "${{ needs.e2e.result }}" != "success" ]] || \
             [[ "${{ needs.manifest-validation.result }}" != "success" ]]; then
            echo "::error::CI failed"
            exit 1
          fi

          echo "::notice::All CI checks passed!"
